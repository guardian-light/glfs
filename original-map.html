  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; overflow: hidden; background: transparent; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }
    body { padding: 0; touch-action: manipulation; }
    #map-card { width: 100%; height: 100%; min-height: 390px; position: relative; display: grid; grid-template-rows: auto 1fr; gap: 10px; }
    .map-heading { text-align: center; color: #080b18; font-size: clamp(18px, 3.1vw, 31px); letter-spacing: 1px; font-weight: 500; line-height: 1.1; padding: 4px 12px 0; }
    .map-heading span { color: #09175f; }
    .map-stage { position: relative; width: 100%; min-height: 340px; overflow: hidden; border-radius: 12px; background: linear-gradient(180deg, #f8f3e8, #e8f0df); border: 1px solid rgba(13,70,102,.18); }
    svg { width: 100%; height: 100%; min-height: 340px; display: block; }
    .county-shape { fill: #f8f1df; stroke: rgba(13,70,102,.22); stroke-width: .8; }
    .county-name { font-size: 10px; fill: rgba(8,50,71,.66); text-anchor: middle; font-weight: 800; paint-order: stroke; stroke: rgba(255,255,255,.72); stroke-width: 3px; stroke-linejoin: round; }
    .region-card { cursor: pointer; transform-box: fill-box; transform-origin: center; transition: transform 220ms ease, filter 220ms ease, opacity 180ms ease; }
    .region-card rect { filter: drop-shadow(0 8px 14px rgba(8,50,71,.22)); stroke: rgba(255,255,255,.72); stroke-width: 1.3; }
    .region-card:hover, .region-card:focus-visible { transform: translateY(-7px) scale(1.035); filter: drop-shadow(0 14px 20px rgba(8,50,71,.28)); outline: none; }
    .region-title { fill: white; font-size: 12px; font-weight: 900; text-anchor: middle; }
    .region-line { fill: white; font-size: 12px; font-weight: 800; text-anchor: middle; }
    .service-dot { opacity: .86; transition: transform 180ms ease, opacity 180ms ease; transform-box: fill-box; transform-origin: center; }
    .service-dot:hover { opacity: 1; transform: scale(1.18); }
    .star { fill: #e59612; stroke: white; stroke-width: 2; }
    .legend { position: absolute; left: 14px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: min(560px, calc(100% - 28px)); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; padding: 7px 9px; border-radius: 999px; background: rgba(255,255,255,.82); color: #083247; font-size: 11px; font-weight: 800; box-shadow: 0 5px 16px rgba(8,50,71,.08); }
    .legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    #copied-toast { position: absolute; left: 50%; bottom: 20px; transform: translate(-50%, 14px); padding: 12px 16px; border-radius: 999px; color: white; background: #083247; font-weight: 900; letter-spacing: .2px; opacity: 0; pointer-events: none; box-shadow: 0 16px 32px rgba(8,50,71,.26); transition: opacity 180ms ease, transform 180ms ease; z-index: 5; }
    #copied-toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 700px) {
      #map-card { min-height: 610px; }
      .map-stage { min-height: 560px; }
      svg { min-height: 560px; }
      .map-heading { font-size: 16px; line-height: 1.25; }
      .county-name { font-size: 8.4px; }
      .region-title, .region-line { font-size: 10.5px; }
      .legend { position: static; padding: 8px 8px 2px; max-width: 100%; }
      .legend span { font-size: 10px; }
      #copied-toast { bottom: 58px; white-space: nowrap; }
    }
  </style>
</head>

  <script>
    (function() {
      var toast = document.getElementById('copied-toast');
      var timer;
      function showToast() {
        clearTimeout(timer);
        toast.classList.add('show');
        timer = setTimeout(function() { toast.classList.remove('show'); }, 1800);
      }
      function fallbackCopy(text) {
        var area = document.createElement('textarea');
        area.value = text;
        area.setAttribute('readonly', '');
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(area);
        showToast();
      }
      document.querySelectorAll('.region-card').forEach(function(card) {
        card.addEventListener('click', function() {
          var text = card.getAttribute('data-copy');
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(showToast).catch(function() { fallbackCopy(text); });
          } else {
            fallbackCopy(text);
          }
        });
        card.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); }
        });
      });
    })();
  </script>
