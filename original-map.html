  <title>Guardian Light Nebraska Map</title>
  <link rel="icon" type="image/png" href="assets/favicon-rounded.png">
  <style>
    html, body { margin: 0; min-height: 100%; background: transparent; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; }

<style>
  #glfs-map-wrap *{box-sizing:border-box;margin:0;padding:0}
  #glfs-map-wrap{width:100%;height:100%;position:relative;font-family:inherit}
  #glfs-map-svg{width:100%;height:100%;display:block;min-height:200px}
  #glfs-map-tip{
    position:absolute;
    background:#fff;
    border:1px solid #e0e0d8;
    border-radius:10px;
    padding:10px 14px;
    font-size:13px;
    pointer-events:none;
    opacity:0;
    transition:opacity 0.12s;
    max-width:220px;
    z-index:100;
    box-shadow:0 2px 12px rgba(0,0,0,0.08);
  }
  #glfs-map-tip .tip-name{font-size:14px;font-weight:600;color:#1a1a1a;margin-bottom:3px}
  #glfs-map-tip .tip-type{font-size:12px;color:#666;margin-bottom:5px}
  #glfs-map-tip .tip-detail{font-size:12px;color:#666;line-height:1.5}
  #glfs-map-legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px 20px;
    padding:10px 0 2px;
    border-top:1px solid #e8e8e0;
    margin-top:8px;
  }
  .glfs-leg-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#666}
  .glfs-leg-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
  .glfs-leg-diamond{width:10px;height:10px;flex-shrink:0;transform:rotate(45deg);border-radius:1px}
  .glfs-map-pin{cursor:pointer}
  .glfs-map-dot{cursor:pointer;transition:opacity 0.1s}
  .glfs-map-dot:hover{opacity:1 !important}
</style>

<script src="assets/topojson-client.min.js"></script>
<script>
(function(){

  var W=780, H=380, PAD=30;

  // --- Location data ---
  var pinData={
    "scottsbluff":{name:"Scottsbluff",type:"Guardian Light Visitation Center",detail:"Serving the Panhandle region of western Nebraska",url:"/locations/scottsbluff"},
    "sidney":{name:"Sidney",type:"Guardian Light Visitation Center",detail:"Serving Cheyenne County & surrounding communities",url:"/locations/sidney"},
    "northplatte":{name:"North Platte",type:"Guardian Light Visitation Center",detail:"Serving Lincoln County & central western Nebraska",url:"/locations/north-platte"},
    "kearney":{name:"Kearney",type:"Guardian Light Visitation Center",detail:"Serving Buffalo County & central Nebraska",url:"/locations/kearney"},
    "lincoln":{name:"Lincoln",type:"Guardian Light Visitation Center",detail:"Serving Lancaster County & southeast Nebraska",url:"/locations/lincoln"},
    "omaha":{name:"Omaha",type:"Guardian Light Visitation Center",detail:"Serving Douglas, Sarpy & surrounding metro counties",url:"/locations/omaha"}
  };

  var dotData={
    "worker":{name:"Family Support Worker",type:"Available in this area",detail:"Guardian Light family support workers serve all 93 Nebraska counties."},
    "fc":{name:"Foster Care Specialist",type:"Available in this area",detail:"Guardian Light foster care specialists support families throughout Nebraska."},
    "therapist":{name:"Therapist / Skill Builder",type:"Available in this area",detail:"Guardian Light therapists and skill builders serve families statewide."}
  };

  var offices=[
    {id:"scottsbluff",lon:-103.67,lat:41.87,label:"SB"},
    {id:"sidney",lon:-102.98,lat:41.14,label:"SI"},
    {id:"northplatte",lon:-100.76,lat:41.12,label:"NP"},
    {id:"kearney",lon:-99.08,lat:40.70,label:"KE"},
    {id:"lincoln",lon:-96.70,lat:40.81,label:"LN"},
    {id:"omaha",lon:-96.04,lat:41.26,label:"OM"}
  ];



  var workers=[
    [-103.7,42.5],[-103.2,41.8],[-102.8,42.4],[-102.5,41.5],[-102.1,41.3],
    [-101.7,42.6],[-101.4,41.9],[-101.0,42.4],[-100.7,41.6],[-100.4,42.8],
    [-100.1,41.9],[-99.8,42.3],[-99.5,41.7],[-99.2,42.5],[-98.9,41.9],
    [-98.6,42.4],[-98.3,41.6],[-98.0,42.7],[-97.7,41.9],[-97.4,42.3],
    [-97.1,41.7],[-96.8,42.1],[-96.5,41.4],[-96.3,41.8],[-96.1,41.35],
    [-103.0,40.4],[-102.5,40.3],[-102.0,40.4],[-101.5,40.3],[-101.0,40.4],
    [-100.5,40.3],[-100.0,40.4],[-99.5,40.3],[-99.0,40.5],[-98.5,40.3],
    [-98.0,40.4],[-97.5,40.3],[-97.0,40.5],[-96.5,40.3],[-96.2,40.4],
    [-103.5,41.5],[-101.8,43.0],[-100.8,43.0],[-99.2,42.95],[-97.5,42.85],
    [-96.4,41.15],[-95.98,41.55],[-95.97,41.85]
  ];

  var fc=[
    [-103.4,41.9],[-102.1,42.7],[-100.2,42.1],[-98.1,41.4],
    [-96.7,41.8],[-96.0,41.5],[-96.05,42.0]
  ];

  var therapists=[
    [-99.1,40.6],[-98.3,41.1],[-97.3,40.9],[-96.4,40.7],
    [-96.15,41.05],[-96.1,41.68],[-103.0,41.4]
  ];

  // --- Tooltip helpers ---
  var tip=document.getElementById("glfs-map-tip");
  var wrap=document.getElementById("glfs-map-wrap");

  function showTip(name,type,detail){ 
    document.getElementById("glfs-tip-name").textContent=name;
    document.getElementById("glfs-tip-type").textContent=type;
    document.getElementById("glfs-tip-detail").textContent=detail;
    tip.style.opacity="1";
  }
  function moveTip(e){
    var r=wrap.getBoundingClientRect();
    var x=e.clientX-r.left+14, y=e.clientY-r.top-14;
    if(x+230>r.width) x=e.clientX-r.left-235;
    if(y+110>r.height) y=e.clientY-r.top-115;
    tip.style.left=x+"px"; tip.style.top=y+"px";
  }
  function hideTip(){ tip.style.opacity="0"; }

  // --- Build map ---
  function buildMap(pathD, project){
    var svg=document.getElementById("glfs-map-svg");
    var ns="http://www.w3.org/2000/svg";

    // Grid
    var grid="";
    for(var lon=-104;lon<=-96;lon++){
      var p1=project(lon,44), p2=project(lon,39);
      grid+='<line x1="'+p1[0].toFixed(1)+'" y1="'+p1[1].toFixed(1)+'" x2="'+p2[0].toFixed(1)+'" y2="'+p2[1].toFixed(1)+'" stroke="#cfd0c8" stroke-width="0.3"/>';
    }
    for(var lat=40;lat<=43;lat+=0.5){
      var p1=project(-105,lat), p2=project(-95,lat);
      grid+='<line x1="'+p1[0].toFixed(1)+'" y1="'+p1[1].toFixed(1)+'" x2="'+p2[0].toFixed(1)+'" y2="'+p2[1].toFixed(1)+'" stroke="#cfd0c8" stroke-width="0.3"/>';
    }

    function dot(lon,lat,fill,kind){
      var p=project(lon,lat);
      return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="5" fill="'+fill+'" opacity="0.65" class="glfs-map-dot" data-kind="'+kind+'" style="cursor:pointer"/>';
    }

    var html=
      '<defs><clipPath id="glfs-ne-clip"><path d="'+pathD+'"/></clipPath></defs>'+
      '<g clip-path="url(#glfs-ne-clip)">'+
        '<path d="'+pathD+'" fill="#ecefe7"/>'+
        grid+
        '<g>'+
          workers.map(function(p){return dot(p[0],p[1],"#1D9E75","worker");}).join("")+
          fc.map(function(p){return dot(p[0],p[1],"#378ADD","fc");}).join("")+
          therapists.map(function(p){return dot(p[0],p[1],"#EF9F27","therapist");}).join("")+
        '</g>'+
      '</g>'+
      '<path d="'+pathD+'" fill="none" stroke="#7a8c70" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';

    offices.forEach(function(o){
      var p=project(o.lon,o.lat);
      html+='<g class="glfs-map-pin" data-id="'+o.id+'" transform="translate('+p[0].toFixed(1)+','+p[1].toFixed(1)+')" tabindex="0" role="button" aria-label="'+pinData[o.id].name+' Office">'+
        '<line x1="0" y1="-12" x2="0" y2="-2" stroke="#185FA5" stroke-width="1.4"/>'+
        '<polygon points="0,0 3.5,-5 -3.5,-5" fill="#185FA5"/>'+
        '<circle cx="0" cy="-21" r="9.5" fill="#185FA5" stroke="white" stroke-width="1.5"/>'+
        '<text x="0" y="-17.5" font-size="7.5" fill="white" text-anchor="middle" font-family="inherit" font-weight="700">'+o.label+'</text>'+
      '</g>';
    });



    html+='<text x="'+W/2+'" y="'+(H-4)+'" font-size="8.5" fill="#b4b2a9" text-anchor="middle" font-family="inherit">Serving all 93 Nebraska counties</text>';

    svg.innerHTML=html;

    // Wire dots
    svg.querySelectorAll(".glfs-map-dot").forEach(function(d){
      var info=dotData[d.dataset.kind];
      d.addEventListener("mouseenter",function(){showTip(info.name,info.type,info.detail);});
      d.addEventListener("mousemove",moveTip);
      d.addEventListener("mouseleave",hideTip);
    });

    // Wire office/vc pins
    svg.querySelectorAll(".glfs-map-pin").forEach(function(p){
      var d=pinData[p.dataset.id];
      if(!d) return;
      p.addEventListener("mouseenter",function(){showTip(d.name,d.type,d.detail);});
      p.addEventListener("mousemove",moveTip);
      p.addEventListener("mouseleave",hideTip);
      p.addEventListener("click",function(){window.location.href=d.url;});
      p.addEventListener("keydown",function(e){if(e.key==="Enter") window.location.href=d.url;});
    });
  }

  // --- Fetch and render ---
  fetch("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json")
    .then(function(r){return r.json();})
    .then(function(us){
      var nebraska=topojson.feature(us,us.objects.states).features.find(function(f){return f.id==="31";});
      var coords=nebraska.geometry.type==="Polygon"
        ? nebraska.geometry.coordinates
        : nebraska.geometry.coordinates.flat();

      var minLon=Infinity,maxLon=-Infinity,minLat=Infinity,maxLat=-Infinity;
      coords.forEach(function(ring){ring.forEach(function(pt){
        if(pt[0]<minLon) minLon=pt[0]; if(pt[0]>maxLon) maxLon=pt[0];
        if(pt[1]<minLat) minLat=pt[1]; if(pt[1]>maxLat) maxLat=pt[1];
      });});

      var lonR=maxLon-minLon, latR=maxLat-minLat;
      var bMinLon=minLon-lonR*0.04, bMaxLon=maxLon+lonR*0.04;
      var bMinLat=minLat-latR*0.06, bMaxLat=maxLat+latR*0.06;

      function project(lon,lat){
        var x=PAD+(lon-bMinLon)/(bMaxLon-bMinLon)*(W-PAD*2);
        var y=PAD+(bMaxLat-lat)/(bMaxLat-bMinLat)*(H-PAD*2);
        return[x,y];
      }

      var pathD="";
      coords.forEach(function(ring){
        var pts=ring.map(function(pt){return project(pt[0],pt[1]);});
        pathD+="M "+pts.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" L ")+" Z ";
      });

      buildMap(pathD.trim(), project);
    })
    .catch(function(){
      document.getElementById("glfs-map-svg").innerHTML=
        '<text x="390" y="190" text-anchor="middle" font-size="14" fill="#888" font-family="inherit">Map unavailable. Please try refreshing the page.</text>';
    });

})();
</script>
